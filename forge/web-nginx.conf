# Paste into: Website site → Nginx configuration.
# Replace ONLY the `location / { ... }` block (and delete the `location ~ \.php$` block
# and the `error_page 404 /index.php;` line). Keep Forge's server_name / SSL lines.

location / {
    proxy_pass http://127.0.0.1:4321;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_read_timeout 60s;
    client_max_body_size 20m;   # winner ID uploads pass through the website
}
