name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api:
    name: API (PHP 8.5)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, intl, gmp
          coverage: none

      - name: Install Composer dependencies
        # The Verity draw engine is a private package: read-only token, never in the repo or the logs.
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.VERITY_COMPOSER_TOKEN }}"}}'
        run: composer install --no-interaction --prefer-dist

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: php artisan test

  api-mysql:
    name: API (PHP 8.5, MySQL 8.4)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wds_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: wds_test
      # An ordinary user with rights on its own databases only, like Forge's site user (not root), so
      # Verity's migration has to create its triggers the way it will on the server.
      DB_USERNAME: wds
      DB_PASSWORD: wds
      DB_RACE_DATABASE: wds_race

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, pdo_mysql, intl, gmp
          coverage: none

      - name: Create race-test database and an ordinary (non-root) user
        # As on the Forge server (forge/README.md section 4): binary logging stays on, and
        # log_bin_trust_function_creators = 1 lets an ordinary user create Verity's triggers.
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "SET PERSIST log_bin_trust_function_creators = 1;"
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE wds_race; CREATE USER 'wds'@'%' IDENTIFIED BY 'wds'; GRANT ALL PRIVILEGES ON wds_test.* TO 'wds'@'%'; GRANT ALL PRIVILEGES ON wds_race.* TO 'wds'@'%';"
          mysql -h 127.0.0.1 -uroot -proot -N -e "SELECT CONCAT('log_bin=', @@log_bin, ' log_bin_trust_function_creators=', @@log_bin_trust_function_creators)"

      - name: Install Composer dependencies
        # The Verity draw engine is a private package: read-only token, never in the repo or the logs.
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.VERITY_COMPOSER_TOKEN }}"}}'
        run: composer install --no-interaction --prefer-dist

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: php artisan test

  web:
    name: Website build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
